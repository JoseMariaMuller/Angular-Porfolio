<section class="py-16 px-6 max-w-4xl mx-auto">
    <h2 class="text-3xl font-bold mb-8 text-center text-white">Stack Tecnológico</h2>
    <div class="flex flex-wrap justify-center gap-3">
        @for (skill of skills; track skill) {
        <span class="px-4 py-2 bg-gray-800 rounded-full text-sm font-medium text-gray-200 border border-gray-700">
            {{ skill }}
        </span>
        }
    </div>
</section>
