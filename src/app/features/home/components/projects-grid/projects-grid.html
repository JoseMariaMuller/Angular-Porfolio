<section id="proyectos" class="relative" #wrapperEl [style.height.px]="(projects().length * 700)">

  <div class="sticky top-0 h-screen flex flex-col justify-center overflow-hidden">

    <h2 class="text-4xl md:text-5xl font-bold text-white text-center mb-10 px-6">Proyectos</h2>

    <div class="overflow-hidden" #viewportEl>
  <div #trackEl class="flex gap-12 px-[10vw] md:px-[20vw] w-max will-change-transform">
    @for (project of projects(); track project.id) {
      <div class="w-[85vw] md:w-150 shrink-0">
        <app-project-card [project]="project" />
      </div>
    }
  </div>
</div>

    <div class="mt-10 flex justify-center gap-2">
      @for (project of projects(); track project.id; let i = $index) {
        <span
          class="h-1.5 rounded-full transition-all duration-300 bg-gray-700"
          [class.bg-indigo-500]="progress() * (projects().length - 1) >= i - 0.4 && progress() * (projects().length - 1) <= i + 0.4"
          [style.width.px]="progress() * (projects().length - 1) >= i - 0.4 && progress() * (projects().length - 1) <= i + 0.4 ? 32 : 8"
        ></span>
      }
    </div>
  </div>
</section>
