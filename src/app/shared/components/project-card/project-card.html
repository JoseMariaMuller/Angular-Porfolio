<div
    class="bg-gray-800 rounded-xl p-6 border border-gray-700 hover:border-indigo-500 hover:scale-[1.02] transition duration-300">
    <h3 class="text-xl font-semibold text-white">{{ project().name }}</h3>
    <p class="mt-2 text-gray-400 text-sm">{{ project().description }}</p>

    <div class="mt-4 flex flex-wrap gap-2">
        @for (tech of project().techStack; track tech) {
        <span class="px-2 py-1 bg-gray-900 rounded text-xs text-indigo-300 border border-gray-700">
            {{ tech }}
        </span>
        }
    </div>

    <div class="mt-5 flex gap-4">
        <a [href]="project().githubUrl" target="_blank" class="text-sm text-indigo-400 hover:underline">
            GitHub →
        </a>
        @if (project().liveUrl) {
        <a [href]="project().liveUrl" target="_blank" class="text-sm text-gray-400 hover:underline">
            Demo →
        </a>
        }
    </div>
</div>
