<div
    class="group bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-indigo-500 hover:-translate-y-1 transition duration-300">

    <!-- Imagen -->
    <div class="relative overflow-hidden h-44">
        <img [src]="project().imageUrl" [alt]="project().name"
            class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
        @if (project().featured) {
        <span class="absolute top-3 right-3 bg-indigo-600 text-white text-xs font-semibold px-3 py-1 rounded-full">
            Destacado
        </span>
        }
    </div>

    <!-- Contenido -->
    <div class="p-6">
        <h3 class="text-xl font-semibold text-white">{{ project().name }}</h3>
        <p class="mt-2 text-gray-400 text-sm leading-relaxed">{{ project().description }}</p>

        <div class="mt-4 flex flex-wrap gap-2">
            @for (tech of project().techStack; track tech) {
            <span class="px-2 py-1 bg-gray-900 rounded text-xs text-indigo-300 border border-gray-700">
                {{ tech }}
            </span>
            }
        </div>

        <div class="mt-5 flex gap-4 items-center">
            <a [href]="project().githubUrl" target="_blank"
                class="flex items-center gap-1 text-sm text-gray-300 hover:text-white transition">
                <i class="devicon-github-original text-white"></i>
                Código
            </a>
            @if (project().liveUrl) {
            <a [href]="project().liveUrl" target="_blank"
                class="flex items-center gap-1 text-sm text-indigo-400 hover:text-indigo-300 transition">
                Ver demo →
            </a>
            }
        </div>
    </div>
</div>
