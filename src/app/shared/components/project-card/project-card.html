<div class="group bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-indigo-500 transition duration-300">

  <div class="relative overflow-hidden h-72">
    <img
      [src]="project().imageUrl"
      [alt]="project().name"
      class="w-full h-full object-cover"
    />
    @if (project().featured) {
      <span class="absolute top-4 right-4 bg-indigo-600 text-white text-sm font-semibold px-4 py-1.5 rounded-full">
        Destacado
      </span>
    }
  </div>

  <div class="p-8">
    <h3 class="text-2xl font-semibold text-white">{{ project().name }}</h3>
    <p class="mt-3 text-gray-400 text-base leading-relaxed">{{ project().description }}</p>

    <div class="mt-5 flex flex-wrap gap-2">
      @for (tech of project().techStack; track tech) {
        <span class="px-3 py-1.5 bg-gray-900 rounded text-sm text-indigo-300 border border-gray-700">
          {{ tech }}
        </span>
      }
    </div>

    <div class="mt-6 flex gap-5 items-center">
      <a [href]="project().githubUrl" target="_blank" class="flex items-center gap-2 text-base text-gray-300 hover:text-white transition">
        <i class="devicon-github-original text-white text-lg"></i>
        Código
      </a>
      @if (project().liveUrl) {
        <a [href]="project().liveUrl" target="_blank" class="flex items-center gap-2 text-base text-indigo-400 hover:text-indigo-300 transition">
          Ver demo →
        </a>
      }
    </div>
  </div>
</div>
